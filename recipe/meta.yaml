{% set name = "furo" %}
{% set version = "2025.12.19" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 188d1f942037d8b37cd3985b955839fea62baa1730087dc29d157677c857e2a7

build:
  skip: true  # [py<38]
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  script_env:
    - STB_USE_SYSTEM_NODE=1

requirements:
  host:
    - python
    - flit-core >=2,<4
    - pip
    - sphinx-theme-builder >=0.2.0a10
    - nodejs ==18.20.5
  run:
    - python
    - beautifulsoup4
    - sphinx >=7.0,<10.0
    - sphinx-basic-ng >=1.0.0.beta2
    - pygments >=2.7
    - accessible-pygments >=0.0.5 

test:
  imports:
    # One more reason to dislike type-hints
    # This is a dirty hack because sphinx.application
    # isn't available with a simple `import sphinx`
    - sphinx.application
    - furo
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/pradyunsg/furo
  summary: A clean customisable Sphinx documentation theme.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - asmeurer
    - gforsyth
